name: Build CGL APT Repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cgl-apt-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg
          chmod +x cgl scripts/*.sh
          ./scripts/build-deb.sh
          ./scripts/test.sh

      - name: Build signed APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -eu

          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "APT_GPG_PRIVATE_KEY GitHub Actions secret is required." >&2
            exit 1
          fi

          VERSION="$(sed -n 's/^Version: //p' package/DEBIAN/control | head -n1)"
          DEB="dist/cgl_${VERSION}_all.deb"
          test -f "$DEB"

          rm -rf public gnupg
          mkdir -p             public/pool/main/c/cgl             public/public/pool/main/c/cgl             public/dists/stable/main/binary-all             public/dists/stable/main/binary-amd64             public/dists/stable/main/binary-arm64             public/dists/stable/main/binary-armhf             public/dists/stable/main/binary-i386             gnupg
          chmod 700 gnupg
          export GNUPGHOME="$PWD/gnupg"

          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

          # Canonical package path.
          cp "$DEB" public/pool/main/c/cgl/

          # Legacy package path retained for clients that cached old metadata.
          cp "$DEB" public/public/pool/main/c/cgl/

          (
            cd public
            dpkg-scanpackages --arch all pool/main/c/cgl /dev/null > dists/stable/main/binary-all/Packages
          )

          for arch in amd64 arm64 armhf i386; do
            cp public/dists/stable/main/binary-all/Packages "public/dists/stable/main/binary-$arch/Packages"
          done

          gzip -9c public/dists/stable/main/binary-all/Packages > public/dists/stable/main/binary-all/Packages.gz
          for arch in amd64 arm64 armhf i386; do
            gzip -9c "public/dists/stable/main/binary-$arch/Packages" > "public/dists/stable/main/binary-$arch/Packages.gz"
          done

          if grep -R '^Filename: public/' public/dists/stable/main; then
            echo "ERROR: APT metadata contains an invalid public/ package path." >&2
            exit 1
          fi

          test -f "public/pool/main/c/cgl/cgl_${VERSION}_all.deb"
          test -f "public/public/pool/main/c/cgl/cgl_${VERSION}_all.deb"

          cd public/dists/stable
          cat > Release <<EOF
          Origin: CGL+
          Label: CGL+
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64 armhf i386 all
          Components: main
          Description: CGL+ Debian package repository
          Date: $(date -Ru)
          EOF

          {
            echo "SHA256:"
            find main -type f -print0 | sort -z | while IFS= read -r -d '' file; do
              hash="$(sha256sum "$file" | awk '{print $1}')"
              size="$(wc -c < "$file" | tr -d ' ')"
              printf " %s %s %s\n" "$hash" "$size" "$file"
            done
          } >> Release

          KEY_ID="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="sec"{print $5; exit}')"
          [ -n "$KEY_ID" ] || { echo "No signing key imported." >&2; exit 1; }

          if [ -n "${APT_GPG_PASSPHRASE:-}" ]; then
            printf '%s\n' "$APT_GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --local-user "$KEY_ID" --clearsign --output InRelease Release
            printf '%s\n' "$APT_GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --local-user "$KEY_ID" --detach-sign --armor --output Release.gpg Release
          else
            gpg --batch --yes --local-user "$KEY_ID" --clearsign --output InRelease Release
            gpg --batch --yes --local-user "$KEY_ID" --detach-sign --armor --output Release.gpg Release
          fi

          cd ../../..
          gpg --batch --export --armor "$KEY_ID" > public/cgl-archive-keyring.asc
          gpg --batch --export "$KEY_ID" > public/cgl-archive-keyring.gpg
          cp install.sh public/install.sh
          chmod 0755 public/install.sh
          printf '%s\n' 'packages.crazygamelabs.co.uk' > public/CNAME

          # Mirror the complete repository into /public as well. This supports
          # GitHub Pages configurations whose source directory is gh-pages:/public
          # while retaining the canonical repository at gh-pages:/.
          rm -rf public/public/dists public/public/install.sh public/public/CNAME public/public/cgl-archive-keyring.asc public/public/cgl-archive-keyring.gpg
          cp -a public/dists public/public/dists
          cp public/install.sh public/public/install.sh
          cp public/CNAME public/public/CNAME
          cp public/cgl-archive-keyring.asc public/public/cgl-archive-keyring.asc
          cp public/cgl-archive-keyring.gpg public/public/cgl-archive-keyring.gpg

      - name: Verify repository files before Pages publish
        run: |
          set -eu
          VERSION="$(sed -n 's/^Version: //p' package/DEBIAN/control | head -n1)"
          for root in public public/public; do
            test -f "$root/dists/stable/Release"
            test -f "$root/dists/stable/InRelease"
            test -f "$root/pool/main/c/cgl/cgl_${VERSION}_all.deb"
            test -f "$root/CNAME"
          done

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          commit_message: Publish signed CGL APT repository with root and public source compatibility
